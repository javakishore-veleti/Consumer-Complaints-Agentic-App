# Local Redis Stack for CCAA (D94 / M09): vector search + cache in ONE Redis container.
# Separate from Chroma and Postgres. Opt-in: npm run local:containers:redis:start
#
# Then set:
#   CCA_REDIS_URL=redis://127.0.0.1:6379/0
name: cca-redis

services:
  redis:
    image: redis/redis-stack:7.2.0-v10
    container_name: cca-redis-stack
    ports:
      - "127.0.0.1:${CCA_REDIS_PORT:-6379}:6379"
      - "127.0.0.1:${CCA_REDIS_UI_PORT:-8001}:8001"
    volumes:
      - cca-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  cca-redis-data:
