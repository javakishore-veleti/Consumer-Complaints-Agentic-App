# Local Postgres + pgvector for CCAA Storage Layer (D92 / M07).
# Opt-in: npm run local:containers:pgvector:start
#   (or: bash CICD/Local/docker-all-up.sh --profile pgvector)
#
# Then set Middleware / Airflow:
#   CCA_PGVECTOR_URL=postgresql://postgres:postgres@127.0.0.1:5433/cca_vectors
#
# Port 5433 avoids clashing with operational Postgres on 5432 (CICD/Local/postgres).
name: cca-pgvector

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: cca-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cca_vectors}
    ports:
      - "127.0.0.1:${CCA_PGVECTOR_PORT:-5433}:5432"
    volumes:
      - cca-pgvector-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  cca-pgvector-data:
