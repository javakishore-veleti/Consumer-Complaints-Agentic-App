# Apache Airflow 3.4.0, local, LocalExecutor.
# Adapted from the official file https://airflow.apache.org/docs/apache-airflow/stable/docker-compose.yaml
# with Redis, the Celery worker and Flower removed: tasks run inside the scheduler, which is all a laptop needs.
#
# Normally started through CICD/Local/docker-all-up.sh. By hand:
#   cd CICD/Local/airflow
#   cp .env.example .env     (fill in the secrets, see that file)
#   docker compose up -d --build   (builds Dockerfile with pymongo; airflow-init runs first)
#   open http://localhost:8080      login: airflow / airflow
#   Verify: docker compose exec airflow-scheduler python -c 'import pymongo; print(pymongo.__version__)'
#
# DAGs live in <repo>/Middleware/Airflow-dags. Local refresh is 10s via AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL (Airflow 3.4.0; local-only; default is 300).
# For Docker Airflow download DAGs (D63 / M10-0005 #212): set Airflow Variable CCA_DB_URL to a Postgres URL the
# containers can reach, and set LOCAL_DATA_PATH_CFPB to the host imports path below (same path is bind-mounted).
# Localhost default: $HOME/runtime_data/apps/datasets/CCA/complains_datasets/imports
# Stop with `docker compose down` (add -v to also wipe the metadata database).
name: airflow


x-airflow-common:
  &airflow-common
  # M17-0009 / #257: bake pymongo into the image (Mongo ingest DAGs / D51).
  # Rebuild after Dockerfile changes: `docker compose build` then `up -d`, or `docker-all-up.sh` (--build).
  build:
    context: .
    dockerfile: Dockerfile
  image: ${AIRFLOW_IMAGE_NAME:-cca-airflow:3.4.0-pymongo}
  env_file:
    - ${ENV_FILE_PATH:-.env}
  environment:
    &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY}
    # Local DX (M10-0014 / #221): create CCAA DAGs enabled so Admin can start workflows without a manual unpause.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: 'http://airflow-apiserver:8080/execution/'
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Prefer Dockerfile bake-in. Ephemeral installs only for one-off experiments.
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}
    AIRFLOW_CONFIG: '/opt/airflow/config/airflow.cfg'
    # Local only: discover new DAG files quickly (Airflow 3.4.0; default 300). Do not copy to cloud stacks.
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: '10'
  volumes:
    - ../../../Middleware/Airflow-dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./config:/opt/airflow/config
    - ./plugins:/opt/airflow/plugins
    # M10-0005 / #212 + M10-0017 / #224: CCA landing tree (LOCAL_DATA_PATH_CFPB under imports/).
    - ${HOME}/runtime_data/apps/datasets/CCA/complains_datasets:${HOME}/runtime_data/apps/datasets/CCA/complains_datasets
    # M17-0005 / #248: per-MIO split source folders under Downloads/temp (bind whole temp tree).
    - ${HOME}/Downloads/temp:${HOME}/Downloads/temp
    # M45-0003 / #322: docker-exec into cca-spark-iceberg for Raw hydrate / DQ.
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  # One-shot: migrates the metadata DB, creates the admin user, fixes folder ownership.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        /entrypoint airflow version
        /entrypoint airflow config list >/dev/null
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ''
    user: "0:0"

  # Run airflow commands: docker compose --profile debug run --rm airflow-cli dags list
  airflow-cli:
    <<: *airflow-common
    profiles:
      - debug
    environment:
      <<: *airflow-common-env
      CONNECTION_CHECK_MAX_COUNT: "0"
    command:
      - bash
      - -c
      - airflow

volumes:
  airflow-postgres-data:
