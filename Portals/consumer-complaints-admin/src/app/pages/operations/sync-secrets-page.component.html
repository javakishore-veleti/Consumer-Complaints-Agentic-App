<div class="space-y-6" data-testid="sync-secrets-page">
  <div>
    <h1 class="text-title-md font-semibold text-gray-800 dark:text-white/90">
      Sync secrets to Airflow
    </h1>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
      Copies named values from the Middleware environment into Airflow Variables.
      Secret values are never displayed.
    </p>
  </div>

  <div>
    <button
      type="button"
      app-button
      variant="primary"
      data-testid="sync-secrets-button"
      [disabled]="busy()"
      (click)="onSync()"
    >
      {{ busy() ? 'Syncing…' : 'Sync secrets to Airflow' }}
    </button>
  </div>

  @if (error()) {
    <div data-testid="sync-secrets-error">
      <app-alert variant="error" title="Sync failed" [message]="error()" />
    </div>
  }

  @if (info()) {
    <div data-testid="sync-secrets-info">
      <app-alert variant="success" title="Sync complete" [message]="info()" />
    </div>
  }

  @if (results().length) {
    <ul data-testid="sync-secrets-results" class="space-y-2 text-sm text-gray-700 dark:text-gray-300">
      @for (row of results(); track row.name) {
        <li data-testid="sync-secrets-result-row">
          <span class="font-medium">{{ row.name }}</span>
          — {{ row.outcome }}
        </li>
      }
    </ul>
  }
</div>
