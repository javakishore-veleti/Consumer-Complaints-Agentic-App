[project]
name = "ccrag"
version = "0.1.0"
description = "Advanced RAG over the CFPB Consumer Complaint Database: every technique behind a flag, measured on a golden set."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openai>=1.99",
    "psycopg[binary]>=3.2",
    "tiktoken>=0.8",
    "langchain-text-splitters>=0.3",
    "rank-bm25>=0.2.2",
    "ranx>=0.3.20",
]

[project.optional-dependencies]
# bge / MiniLM cross-encoder rerankers (pulls in torch, ~2 GB)
rerank = ["sentence-transformers>=3.0"]
notebook = ["jupyterlab>=4", "ipykernel>=6", "nbformat>=5"]
dev = ["pytest>=8"]

[project.scripts]
ccrag = "ccrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]