name: middleware-ci

on:
  push:
    paths: ["Middleware/ConsumerComplaintsHandsOn/**", ".github/workflows/middleware-ci.yml"]
  pull_request:
    paths: ["Middleware/ConsumerComplaintsHandsOn/**", ".github/workflows/middleware-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Middleware/ConsumerComplaintsHandsOn
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cca_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Layer rules (import-linter)
        run: uv run lint-imports
      - name: Tests (SQLite, plus the Postgres migration test)
        env:
          CCA_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/cca_test
        run: uv run pytest -q
